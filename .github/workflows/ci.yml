name: CI

on:
  push:
    branches: [main, v2-research]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (core + dev; tests run offline with a hashing embedder and a mock LLM)
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Tests
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image (no push)
        run: docker build --build-arg PREFETCH_MODELS=0 -t mhrag:ci .

  deploy-space:
    # Runs only on main and only when the HF_TOKEN secret exists (Settings -> Secrets -> Actions).
    # Set the repository variable HF_SPACE_ID to <user>/<space-name>.
    runs-on: ubuntu-latest
    needs: [test, docker]
    if: github.ref == 'refs/heads/main'
    env:
      HF_TOKEN: ${{ secrets.HF_TOKEN }}
      HF_SPACE_ID: ${{ vars.HF_SPACE_ID }}
    steps:
      - uses: actions/checkout@v4
        if: env.HF_TOKEN != ''
      - uses: actions/setup-python@v5
        if: env.HF_TOKEN != ''
        with:
          python-version: "3.11"
          cache: pip
      # The raw data (Mind content and other third-party sources) is not in the repository, so the index cannot be
      # built here; a public Space also needs Mind's permission (README, Data sources and licences).
      - name: Skip without raw data
        if: env.HF_TOKEN != '' && hashFiles('data/raw_data.zip') == ''
        run: echo "data/raw_data.zip is not in the repository; the Space is not deployed from CI."
      - name: Build the fastembed index
        if: env.HF_TOKEN != '' && hashFiles('data/raw_data.zip') != ''
        run: |
          pip install -e . fastembed
          python -m scripts.build_index --backend fastembed
      - name: Upload to the Space
        if: env.HF_TOKEN != '' && hashFiles('data/raw_data.zip') != ''
        run: python -m scripts.deploy_space --space "$HF_SPACE_ID"
