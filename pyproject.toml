[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mhrag"
version = "2.0.0"
description = "Safety-aware, citation-grounded retrieval-augmented chatbot for mental-health psychoeducation"
readme = "README.md"
license = { text = "MIT (code only; see README for data licences)" }
authors = [{ name = "Aryan Sharma" }]
requires-python = ">=3.10"
# Core = what the CPU server needs (no torch).
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "pydantic-settings>=2.3",
  "pypdfium2>=4.30",
  "bm25s>=0.2",
  "PyStemmer>=2.2",
  "tokenizers>=0.19",
  "huggingface_hub>=0.23",
  "httpx>=0.27",
  "scikit-learn>=1.9.1,<1.10",  # artifacts/risk_classifier/tfidf_lr.joblib is a 1.9.1 pickle
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "slowapi>=0.1.9",
]

[project.optional-dependencies]
# ONNX embeddings + reranking + llama.cpp: the CPU deployment
cpu = ["fastembed>=0.3", "llama-cpp-python>=0.2.90"]
# Local transformers inference / training (GPU or Apple MPS)
gpu = [
  "torch>=2.2",
  "transformers>=4.44",
  "sentence-transformers>=3.0",
  "accelerate>=0.30",
  "bitsandbytes>=0.43; platform_system == 'Linux'",
]
eval = [
  "scipy>=1.11",
  "rouge-score>=0.1.2",
  "bert-score>=0.3.13",
  "textstat>=0.7.3",
  "krippendorff>=0.6",
  "pypdf>=4.0",
  "psutil>=5.9",
  "tqdm>=4.66",
]
dev = ["pytest>=8.0", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["mhrag*", "server*", "scripts*", "eval*"]

[tool.ruff]
line-length = 110
target-version = "py310"
extend-exclude = ["notebooks", "paper", "web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501", "B008", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: needs downloaded models (skipped offline)"]
