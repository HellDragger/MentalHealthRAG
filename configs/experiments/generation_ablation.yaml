# Component ablation of the full pipeline against naive RAG (reviewer question: is the faithfulness gain the
# retrieval, the prompt, or just more retrieved text?). One model, every arm in the same run and hardware.
#   abl_<retrieval>_<prompt>: retrieval naive = dense MiniLM top-2 of 48-token chunks; full = hybrid + rerank,
#   256-token chunks within the context budget. prompt naive = the minimal template, no system prompt;
#   full = grounded system prompt with numbered sources. _matched: full/full, but cut to the same number of
#   characters of retrieved text as naive/naive got for that question.
# No safety gate and no output checks in any arm, so every answer is generated by the model.
#   python -m scripts.run_eval --config configs/experiments/generation_ablation.yaml
kind: generation
name: ablation
models:
  - qwen2.5-1.5b-gguf
profiles: [abl_naive_naive, abl_naive_full, abl_full_naive, abl_full_full, abl_full_full_matched]
compare:   # paired tests (bootstrap, Holm within each metric)
  - [abl_full_full, abl_naive_naive]     # everything
  - [abl_full_naive, abl_naive_naive]    # retrieval alone (naive prompt)
  - [abl_naive_full, abl_naive_naive]    # prompt alone (naive retrieval)
  - [abl_full_full, abl_full_naive]      # prompt, given full retrieval
  - [abl_full_full, abl_naive_full]      # retrieval, given the full prompt
  - [abl_full_full_matched, abl_naive_full]  # retrieval quality at equal context length
  - [abl_full_full, abl_full_full_matched]   # context length, given full retrieval and prompt
datasets: [faq_gen, oos_questions]
naive: {embedder: minilm, chunk_tokens: 48}
temperature: 0.0
nli_model: cross-encoder/nli-deberta-v3-base
bertscore_model: roberta-large
timeout_s: 300
