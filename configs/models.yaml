# LLM catalogue. IDs, gating and licences were checked against the Hugging Face API
# (https://huggingface.co/api/models/<id>) on 2026-09-24; Groq IDs against https://console.groq.com/docs/models
# on the same date. GPT-J-6B and GPT-OSS parameter counts are from the model cards (the API reports none). Gated models ("manual") need you to accept the licence on the model page and an HF_TOKEN.
#
# Fields:
#   backend: hf | llamacpp | ollama | openai_compatible | mock
#   hf_id / gguf_repo+gguf_file / ollama_tag / api_model + base_url + api_key_env
#   family: used for chat-template quirks (mhrag/llm/templates.py); 'completion' = base LM with a plain-text prompt,
#           'seq2seq' = encoder-decoder (arch: seq2seq)
#   context: max context tokens we allow (prompt + generation)
#   local_alternative: a GGUF build suggested in the UI when this model cannot run here
#   v1_model: true for the models the original v1 project used (grouped separately in the UI)
#   price_per_m_input / price_per_m_output: USD per 1M tokens for API models. Left null on purpose: prices
#   change; fill them in from the provider's pricing page on the day you run the benchmark.

models:
  # ---------------------------------------------------------------- baseline from v1
  mistral-7b-instruct-v0.3:
    local_alternative: mistral-7b-gguf
    v1_model: true            # used by the original (v1) project
    label: Mistral-7B-Instruct-v0.3
    backend: hf
    hf_id: mistralai/Mistral-7B-Instruct-v0.3
    family: mistral
    params_b: 7.25
    license: apache-2.0
    gated: false
    context: 8192
  mistral-7b-gguf:
    label: Mistral-7B-Instruct-v0.3 (GGUF Q4_K_M)
    backend: llamacpp
    gguf_repo: bartowski/Mistral-7B-Instruct-v0.3-GGUF
    gguf_file: Mistral-7B-Instruct-v0.3-Q4_K_M.gguf
    family: mistral
    params_b: 7.25
    license: apache-2.0
    gated: false
    context: 8192

  # ---------------------------------------------------------------- Llama
  llama-3.1-8b-instruct:
