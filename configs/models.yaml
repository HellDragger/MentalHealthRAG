    family: gemma
    params_b: 4.30
    license: gemma (Gemma Terms of Use)
    gated: manual
    context: 8192
  gemma-3-4b-it-fp32:
    # Gemma-3 overflows in float16: on a T4 (no native bf16) the fp16 run produced only empty text. This entry runs
    # the same model with 32-bit compute (4-bit weights on CUDA still apply); slower, but numerically safe.
    label: Gemma-3-4B-it (32-bit compute)
    backend: hf
    hf_id: google/gemma-3-4b-it
    family: gemma
    params_b: 4.30
    dtype: float32
    license: gemma (Gemma Terms of Use)
    gated: manual
    context: 8192
