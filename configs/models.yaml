    backend: ollama
    ollama_tag: qwen2.5:1.5b
    base_url_env: OLLAMA_HOST
    base_url: http://localhost:11434
    family: qwen2
    context: 8192

  # ---------------------------------------------------------------- tests / UI dev
  mock:
    label: Mock (offline test model)
    backend: mock
    family: generic
    context: 8192
