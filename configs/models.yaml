  # ---------------------------------------------------------------- domain baseline
  mentallama-chat-7b:
    label: MentaLLaMA-chat-7B (domain baseline)
    backend: hf
    hf_id: klyang/MentaLLaMA-chat-7B
    family: llama2        # fine-tuned from Llama-2-chat-7B; repo ships no chat_template -> Llama-2 [INST] format
    params_b: 6.74
    license: mit (model card); base weights derive from Llama 2 (Llama 2 Community License)
    gated: false
    context: 2048         # model_max_length in tokenizer_config.json

  # ---------------------------------------------------------------- v1 (original project) models, kept as baselines
  # These are NOT instruction-tuned chat models. They run through the same pipeline with a plain-text prompt
  # ("completion" family) or as encoder-decoder models ("seq2seq"). Expect poor, unsafe or off-topic output:
  # they are included to quantify how far the v2 models improve on the original choices.
  gpt2:
    v1_model: true            # used by the original (v1) project
    label: GPT-2 (v1 baseline, base LM)
    backend: hf
    hf_id: openai-community/gpt2
    family: completion
    params_b: 0.137
    license: mit
    gated: false
    context: 1024
  gpt2-medium:
    v1_model: true            # used by the original (v1) project
    label: GPT-2 Medium (base LM)
    backend: hf
    hf_id: openai-community/gpt2-medium
    family: completion
    params_b: 0.380
    license: mit
    gated: false
    context: 1024
  gpt-j-6b:
    v1_model: true            # used by the original (v1) project
    label: GPT-J-6B (v1 "bart.py" model, base LM)
    backend: hf
    hf_id: EleutherAI/gpt-j-6b
    family: completion
    params_b: 6.05
    license: apache-2.0
    gated: false
    context: 2048
  bart-large-cnn:
    v1_model: true            # used by the original (v1) project
    label: BART-large-CNN (v1 summariser, seq2seq)
    backend: hf
    hf_id: facebook/bart-large-cnn
